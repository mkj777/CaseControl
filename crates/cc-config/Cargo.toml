[package]
name = "cc-config"
description = "CaseControl settings and profiles (TOML under %APPDATA%)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
cc-core = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25"
directories = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Read-only access to HKLM\SOFTWARE\Microsoft\Cryptography\MachineGuid (machine binding, ADR 0001 #42). Same version
# as cc-conflicts and cc-system use; safe API, so the crate keeps `unsafe_code = "deny"`.
windows-registry = "0.6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
