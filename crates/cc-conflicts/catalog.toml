# Conflicting-software catalog for CaseControl.
#
# Source: docs/research/03-conflicting-software-catalog.md (section 1, cross-checked with sections 2-4) and the
# local inventory in docs/research/00-overview-and-local-inventory.md.
#
# Field reference (see src/catalog.rs for the authoritative schema):
#   processes          exe names, case-insensitive, '*' wildcard allowed; also matched against the executable of
#                      autostart entries (Run / RunOnce values, Startup folder items)
#   services           Win32 service names (matched against service name and display name), '*' wildcard allowed
#   drivers            kernel driver service names (same matching as services, driver services only)
#   uninstall_names    case-insensitive substring of an Uninstall key DisplayName
#   install_paths      directories checked for existence after %VAR% expansion
#   lighting_providers case-insensitive prefix of a Windows Dynamic Lighting provider name
#   class              suite (full RGB suite: may appear in the start dialog, ADR 0001 #31) | vendor_tool (any
#                      other software: listed on the Conflicts page only)
#   access             hid | smbus | superio | kernel_driver | lamparray | gpu_i2c
#   affects            cc_core::family ids or "all"; empty when the software only fights over devices CaseControl
#                      does not drive
#   verified           false when research 03 marked any listed process/service/driver name UNVERIFIED
#
# Orchestrator decisions (Phase 1 review):
#   - asus_armoury_crate and gigabyte_rgb_fusion list "nvidia_illumination" in `affects`, consistent with the other
#     vendor tools that drive GPU RGB over I2C (they can drive the RGB of partner NVIDIA cards).
#   - class (ADR 0001 #31, phase 3 brief 03): suites are SignalRGB, OpenRGB, iCUE, Armoury Crate / Aura, ASRock
#     Polychrome and Gigabyte RGB Fusion; every other entry is a vendor tool (incl. MSI Center and G HUB).
#   - openrgb `OpenRGB` service, logitech_g_hub `logi_lamparray` driver and the steelseries_gg service name were
#     confirmed on the development machine.

# -----------------------------------------------------------------------------------------------------------------
# RGB suites that drive many vendors' devices
# -----------------------------------------------------------------------------------------------------------------

[[entry]]
id = "signalrgb"
name = "SignalRGB"
vendor = "WhirlwindFX"
category = "rgb_suite"
class = "suite"
processes = ["SignalRgb.exe", "SignalRgbLauncher.exe", "SignalRgbService.exe"]
services = ["SignalRgb.Service"]
drivers = ["SignalRgbDriver"]
uninstall_names = ["SignalRgb"]
install_paths = ["%LOCALAPPDATA%\\VortxEngine"]
lighting_providers = ["SignalRGB"]
access = ["hid", "kernel_driver", "lamparray"]
affects = ["msi_mystic_light", "wooting", "logitech", "nvidia_illumination"]
severity = "high"
verified = true
note = "Kernel driver auto-starts even when the app is closed; registers as a Windows Dynamic Lighting provider. Its Conflicts setting can force-close other RGB apps."

[[entry]]
id = "openrgb"
name = "OpenRGB"
vendor = "OpenRGB project"
category = "rgb_suite"
class = "suite"
processes = ["OpenRGB.exe"]
services = ["OpenRGB"]
uninstall_names = ["OpenRGB"]
access = ["hid", "smbus", "superio", "kernel_driver", "gpu_i2c"]
affects = ["all"]
severity = "high"
verified = true
note = "Opens every device it detects. Optional SDK server on TCP 127.0.0.1:6742 (detected only when the port check is enabled). Uses PawnIO for SMBus since 1.0. 1.x installs an auto-start service `OpenRGB`."

